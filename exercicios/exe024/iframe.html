<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iframes</title>
    <!-- definido tamanhos dos iframes -->
    <style>
        iframe{
            width: 400px;
            height: 400px;
        }
    </style>
  </head>
  <body>
    <!-- tamanho padrao do iframe é 300x150 px -->
    <h1>testando o uso de iframe</h1>
    <p>
      acessando o site do
      <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500px"></iframe>

      para aprender a programar.
    </p>
    <p>
        o repositprio do gustavo guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500px" width="500px">
        </iframe>
        também é legal.
    </p>
  </body>
</html>
